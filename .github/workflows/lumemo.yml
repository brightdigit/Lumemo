name: Lumemo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-ubuntu:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v6
      - uses: brightdigit/swift-build@v1
        with:
          working-directory: Packages/LumemoKit

  test-macos:
    name: Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: brightdigit/swift-build@v1
        with:
          working-directory: Packages/LumemoKit
          xcode: /Applications/Xcode.app

  deploy:
    name: Archive / TestFlight
    runs-on: macos-26
    needs: [test-ubuntu, test-macos]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: bundle install
      - name: Generate Xcode project
        run: tuist generate
        env:
          TUIST_LINT_MODE: none
      - name: Archive (and upload on main)
        run: bundle exec fastlane ${{ github.ref == 'refs/heads/main' && 'beta' || 'archive' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
