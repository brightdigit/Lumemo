# From part-4-github-ci.md §"CI for Other OSes" — Windows (manual).
# Pre-swift-build form: toolchain install + manual cache + symlink fixup
# needed for SwiftPM cache to survive restore on Windows.
jobs:
  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - uses: actions/cache@v5
        with:
          path: .build
          key: spm-windows-${{ hashFiles('Package.resolved') }}

      - name: Fix cache symlinks
        shell: pwsh
        run: |
          # SwiftPM cache stores absolute symlinks that don't survive cache restore on Windows.
          # Rewrite them to point at the current toolchain.

      - run: swift test --enable-code-coverage

      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: windows
