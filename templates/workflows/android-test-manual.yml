# From part-4-github-ci.md §"CI for Other OSes" — Android (manual).
# Pre-swift-build form: free-disk-space dance to reclaim runner disk before
# the SDK download, plus skiptools/swift-android-action for SDK + NDK + build.
jobs:
  test-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android-api-level: [33, 34]
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: skiptools/swift-android-action@v2
        with:
          android-api-level: ${{ matrix.android-api-level }}
          android-run-tests: true

      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: android-api${{ matrix.android-api-level }}
