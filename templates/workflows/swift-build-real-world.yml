# From part-4-github-ci.md §"swift-build" — Real-World Configuration.
# Abbreviated from MonthBar (.github/workflows/monthbar.yml). Build/test
# every supported platform via brightdigit/swift-build@v1; lint on Ubuntu
# after all builds pass; fastlane on self-hosted macOS, gated on builds + lint.
name: CI

on:
  push:
    branches-ignore: ['*WIP']
  workflow_dispatch:

env:
  PACKAGE_NAME: MyAppKit

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift.version }}-${{ matrix.os }}
    strategy:
      matrix:
        os: [noble, jammy]
        swift: [{ version: "6.2" }]
        type: ["", "wasm"]
    steps:
      - uses: actions/checkout@v6
      - uses: brightdigit/swift-build@v1
        with:
          type: ${{ matrix.type }}
          working-directory: Packages/${{ env.PACKAGE_NAME }}

  build-windows:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        runs-on: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: brightdigit/swift-build@v1
        with:
          working-directory: Packages/${{ env.PACKAGE_NAME }}
          windows-swift-version: swift-6.2-release
          windows-swift-build: 6.2-RELEASE

  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        android-api-level: [33, 34]
    steps:
      - uses: actions/checkout@v6
      - uses: jlumbroso/free-disk-space@v1.3.1
      - uses: brightdigit/swift-build@v1
        with:
          working-directory: Packages/${{ env.PACKAGE_NAME }}
          type: android
          android-api-level: ${{ matrix.android-api-level }}
          android-run-tests: true

  build-macos:
    runs-on: [self-hosted, macOS]
    strategy:
      matrix:
        include:
          - {}                                                          # SPM
          - { type: macos }
          - { type: ios,       deviceName: "iPhone 17 Pro",                 osVersion: "26.2" }
          - { type: tvos,      deviceName: "Apple TV",                      osVersion: "26.2" }
          - { type: watchos,   deviceName: "Apple Watch Ultra 3 (49mm)",    osVersion: "26.2" }
          - { type: visionos,  deviceName: "Apple Vision Pro",              osVersion: "26.2" }
    steps:
      - uses: actions/checkout@v6
      - uses: brightdigit/swift-build@v1
        with:
          working-directory: Packages/${{ env.PACKAGE_NAME }}
          type: ${{ matrix.type }}
          xcode: /Applications/Xcode.app
          deviceName: ${{ matrix.deviceName }}
          osVersion: ${{ matrix.osVersion }}

  lint:
    runs-on: ubuntu-latest
    needs: [build-ubuntu, build-macos, build-windows, build-android]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: LINT_MODE=STRICT ./Scripts/lint.sh

  fastlane:
    needs: [build-macos, lint]
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: bundle install
      - run: tuist generate
      - run: bundle exec fastlane ${{ github.ref == 'refs/heads/main' && 'beta' || 'archive' }}
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
