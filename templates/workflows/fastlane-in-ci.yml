# From part-4-github-ci.md §"Fastlane in CI" — first concrete workflow.
# Single job inside .github/workflows/ci.yml — not a separate release.yml.
# This is the only "release" piece; everything else in the workflow is build/test jobs
# (added in §4–§7) and a lint job (added in §5–§6). The fastlane job runs after them.
jobs:
  fastlane:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Cache RubyGems
        uses: actions/cache@v5
        with:
          path: vendor/ruby
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Setup Ruby
        run: |
          ruby --version
          gem install bundler
          bundle install

      - name: Setup Xcode Project
        run: tuist generate
        env:
          TUIST_LINT_MODE: none
          DEVELOPER_DIR: /Applications/Xcode.app

      # `archive` on PRs (build + sign, no upload — catches release-path failures early);
      # `beta` on main (archive + upload_to_testflight). Both lanes live in the Fastfile.
      - name: Archive (and upload on main)
        run: bundle exec fastlane ${{ github.ref == 'refs/heads/main' && 'beta' || 'archive' }}
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEYCHAIN_PASSWORD: ${{ secrets.FASTLANE_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          DEVELOPER_DIR: /Applications/Xcode.app
