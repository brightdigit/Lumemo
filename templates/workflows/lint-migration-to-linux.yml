# From part-4-github-ci.md §"CI for Linux/Ubuntu" — lint job after the
# Linux migration. Same lint job as lint-macos.yml; single line changed:
# runner moves from macos-26 to ubuntu-latest. No container needed; mise
# installs the tools. This is the first payoff for setting up Linux CI —
# free runner minutes on private repos, faster cold-start.
jobs:
  lint:
    runs-on: ubuntu-latest   # was macos-26 in lint-macos.yml
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Lint
        run: LINT_MODE=STRICT ./Scripts/lint.sh
