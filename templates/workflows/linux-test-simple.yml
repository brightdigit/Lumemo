# From part-4-github-ci.md §"CI for Linux/Ubuntu" — simplest Linux test job.
# One runner, one container, one command. The `swift:<ver>-<os>` container
# *is* the toolchain, so no separate install step is needed.
jobs:
  test-linux:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v6
      - run: swift test
