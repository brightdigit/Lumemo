# From part-4-github-ci.md §"Linting in CI" — lint job on macOS.
# Single-step job demonstrating the matrix-of-one pattern (no matrix, just
# checkout → mise → script). Starts on macOS because the reader just
# configured macos-26; §"CI for Linux/Ubuntu" migrates it to ubuntu-latest.
jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Lint
        run: LINT_MODE=STRICT ./Scripts/lint.sh
