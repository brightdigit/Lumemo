# From part-4-github-ci.md §"CI for Apple Platforms" — Apple-platform matrix.
# Pairs `test-spm` (swift test, no xcodebuild) with `test-apple` (matrix over
# five Apple destinations). The include:-pairing form lets each entry pin its
# own Xcode — visionOS uses Xcode 26.1 because it needs a newer SDK.
jobs:
  test-spm:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: swift test

  test-apple:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: 'platform=macOS'
            xcode: '/Applications/Xcode_26.app'
          - destination: 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2'
            xcode: '/Applications/Xcode_26.app'
          - destination: 'platform=tvOS Simulator,name=Apple TV,OS=26.2'
            xcode: '/Applications/Xcode_26.app'
          - destination: 'platform=watchOS Simulator,name=Apple Watch Ultra 3 (49mm),OS=26.2'
            xcode: '/Applications/Xcode_26.app'
          # visionOS pinned to a newer Xcode — newer SDK required
          - destination: 'platform=visionOS Simulator,name=Apple Vision Pro,OS=26.2'
            xcode: '/Applications/Xcode_26.1.app'
    steps:
      - uses: actions/checkout@v6
      - name: Test
        env:
          DEVELOPER_DIR: ${{ matrix.xcode }}
        run: |
          xcodebuild test \
            -scheme MyAppKit-Package \
            -destination '${{ matrix.destination }}' \
            -enableCodeCoverage YES
