# .github/workflows/lumemo.yml — a GitHub Actions *workflow*.
#
# Anatomy (see the diagram in part-4-github-ci.md):
#   workflow file
#     └── on:    <trigger>              ← when this runs
#     └── jobs:  (run in parallel)      ← top-level units of work
#           └── steps: (run sequentially within a job)
#                 ├── uses: <action>    ← reusable action from the Marketplace
#                 └── run:  <command>   ← shell command on the runner
name: Lumemo CI

# on: <trigger>
# When does this workflow run?
# Typically on every push to main and on every pull request targeting main.
on:

# jobs: run in parallel by default.
# Each job picks its own runner and its own ordered list of steps.
jobs:

  # ── job: test-ubuntu ────────────────────────────────────────────────
  # Build and test LumemoKit on Linux to catch platform-specific issues
  # early.
  # Runner + container:
  #   - runs-on: a Linux runner
  #   - container: `swift:6.2-noble` (the Swift toolchain *is* the image)
  # steps: (sequential)
  #   - uses: check out the repo
  #   - uses: `brightdigit/swift-build@v1` against the LumemoKit package
  test-ubuntu:

  # ── job: test-macos ─────────────────────────────────────────────────
  # Build and test LumemoKit on macOS — the canonical Apple-platform
  # check.
  # Runner:
  #   - runs-on: `macos-26` (GitHub-hosted, free for public repos)
  # steps: (sequential)
  #   - uses: check out the repo
  #   - uses: `brightdigit/swift-build@v1` against the LumemoKit package
  #          (pass `xcode:` so it uses xcodebuild for the SPM build)
  test-macos:

  # ── job: deploy ─────────────────────────────────────────────────────
  # On every push: build and sign a release archive. On pushes to main:
  # also upload to TestFlight.
  # Why split it? Running the full archive/sign path on PRs catches
  # signing and packaging failures *before* they reach main — without
  # burning a TestFlight build for every PR.
  # Runner + dependencies:
  #   - runs-on: a macOS runner
  #   - needs: both test jobs must pass first (this is what makes deploy
  #            run *after* the parallel test jobs above)
  #   - runs on PRs AND main (no `if:` gate on the job)
  # steps: (sequential)
  #   - uses: check out the repo
  #   - uses: mise setup
  #   - run:  bundle install
  #   - run:  tuist generate
  #   - run:  fastlane with a ternary picking the lane based on the branch:
  #             bundle exec fastlane ${{ github.ref == 'refs/heads/main' && 'beta' || 'archive' }}
  #           The `archive` lane builds + signs; `beta` does that plus
  #           `upload_to_testflight` (both lanes live in the Fastfile
  #           from Phase 4).
  # Secrets exposed as env vars on the fastlane step:
  #   - APP_STORE_CONNECT_API_KEY_ID
  #   - APP_STORE_CONNECT_API_ISSUER_ID
  #   - APP_STORE_CONNECT_API_KEY_CONTENT
  #   - MATCH_PASSWORD
  #   - MATCH_GIT_BASIC_AUTHORIZATION
  deploy:
